name: Deploy DocFX with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["dev"]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docfx-gh-pages.yml'
  pull_request:
    branches:
      - 'dev'
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docfx-gh-pages.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install DotNet
        uses: actions/setup-dotnet@v6
        with:
          # DocFX builds the API reference from src/**.csproj, which multi-targets
          # net8.0;net9.0;net10.0, so every targeted SDK must be present.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Setup Github Pages
        uses: actions/configure-pages@v6
      - name: Install DocFX
        run: |
          dotnet tool install -g docfx
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Build DocFX Site
        run: docfx docs/docfx.json
      - name: Upload docfx built site artifact
        uses: actions/upload-pages-artifact@v5
        with:
         path: docs/_site

  # Deployment job
  deploy:
    # Never deploy from a pull request, only from pushes and manual runs
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
