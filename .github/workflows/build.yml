name: Examine Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'dev'
      - 'release/*'
      - 'support/*'
      - 'hotfix/*'
    tags: 
      - 'v*'
  pull_request:
    branches:
      - 'master'
      - 'dev'
      - 'release/*'
      - 'support/*'
      - 'hotfix/*'

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    env:
      Test_Proj: src/Examine.Test/Examine.Test.csproj
      Configuration: Release
    strategy:
      matrix:
        include:
          - dotnet-version: '8.0.x'
            tfm: 'net8.0'
          - dotnet-version: '9.0.x'
            tfm: 'net9.0'
          - dotnet-version: '10.0.x'
            tfm: 'net10.0'
  
    steps:
    - uses: actions/checkout@v4
  
    - name: Setup .NET SDK ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Build Tests for TFM ${{ matrix.tfm }}
      run: |
        dotnet build \
          "${{ env.Test_Proj }}" \
          --configuration ${{ env.Configuration }} \
          --framework ${{ matrix.tfm }}

    - name: Run Tests for TFM ${{ matrix.tfm }}
      run: |
        dotnet test \
          "${{ env.Test_Proj }}" \
          --configuration ${{ env.Configuration }} \
          --verbosity normal \
          --framework ${{ matrix.tfm }} \
          --no-build \
          --results-directory "${{ github.workspace }}/_TestResults/${{ matrix.tfm }}" \
          --logger "trx;logfilename=tests.trx" \
          --filter "TestCategory!~Benchmarks"
  
    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      if: always() # Upload results even if the test run fails
      with:
        name: test-results-${{ matrix.tfm }}
        path: ${{ github.workspace }}/_TestResults/${{ matrix.tfm }}/tests.trx

    - name: Test Report
      uses: dorny/test-reporter@v2
      if: ${{ !cancelled() }}       # run this step even if previous step failed
      with:
        name: Publish Tests
        path: ${{ github.workspace }}/_TestResults/**/*.trx
        reporter: dotnet-trx

  build:
    needs: test-matrix
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      semver: ${{ steps.version.outputs.semver }}

    env:
      Solution_File: src/Examine.sln
      Configuration: Release
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create copyright value
      run: |
        $Copyright = "Copyright " + [char]0x00A9 + " Shannon Deminick " + (Get-Date).year
        echo ("Copyright=" + $Copyright) >> $Env:GITHUB_ENV
      shell: pwsh
      
    - name: Setup dotnet
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    # MinVer derives the version from the nearest v* tag; this resolves it for artifact naming and the publish job
    - name: Determine package version
      id: version
      run: |
        $PackageVersionOutputFile = Join-Path $Env:GITHUB_WORKSPACE "_PackageVersion.env"
        dotnet msbuild src/Examine.Core/Examine.Core.csproj `
          -restore `
          -target:WritePackageVersion `
          -property:Configuration=${{ env.Configuration }} `
          -property:ContinuousIntegrationBuild=true `
          -property:PackageVersionOutputFile="$PackageVersionOutputFile"
        $PackageVersion = (Get-Content $PackageVersionOutputFile).Substring("PackageVersion=".Length)
        Write-Host "Using package version: $PackageVersion"
        Get-Content $PackageVersionOutputFile >> $Env:GITHUB_ENV
        "semver=$PackageVersion" >> $Env:GITHUB_OUTPUT
      shell: pwsh

    - name: Pack
      # This will do a full ebuild
      run: |
        dotnet pack ${{ env.Solution_File }} \
          --configuration ${{ env.Configuration }} \
          -p:ContinuousIntegrationBuild=true \
          -p:Copyright="${{ env.Copyright }}" \
          --output=${{ github.workspace }}/_NugetOutput

    - name: Upload artifacts
      uses: actions/upload-artifact@v4  # upload nuget
      if: success()
      with:
        name: examine-nuget-${{ env.PackageVersion }}
        path:  ${{ github.workspace }}/_NugetOutput/*.*

  # Opt-in publish: only runs for v* tags and pauses for approval via the protected 'nuget' environment.
  # See .github/RELEASING.md for the one-time setup.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    environment:
      name: nuget
      url: https://www.nuget.org/packages/Examine/${{ needs.build.outputs.semver }}

    permissions:
      contents: write  # create the GitHub release
      id-token: write  # NuGet trusted publishing (OIDC)

    env:
      SemVer: ${{ needs.build.outputs.semver }}

    steps:
    - name: Download packages
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: examine-nuget-${{ env.SemVer }}
        path: ${{ github.workspace }}/_NugetOutput

    - name: Setup dotnet
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 8.0.x

    - name: NuGet login (trusted publishing)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to NuGet
      # Symbol packages (.snupkg) next to each .nupkg are pushed automatically
      run: |
        dotnet nuget push "${{ github.workspace }}/_NugetOutput/*.nupkg" \
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        prerelease=""
        if [[ "$SemVer" == *-* ]]; then prerelease="--prerelease"; fi
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release upload "$TAG" _NugetOutput/*.nupkg _NugetOutput/*.snupkg --clobber --repo "$GITHUB_REPOSITORY"
        else
          gh release create "$TAG" _NugetOutput/*.nupkg _NugetOutput/*.snupkg \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
        fi
