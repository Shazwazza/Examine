name: 'Test Report'
on:
  workflow_run:
    workflows: ['Examine Build']                     # runs after CI workflow
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - uses: dorny/test-reporter@v3
      with:
        # This workflow always runs from the default branch, but is triggered by builds on every branch.
        # Matches 'test-results-<tfm>' (dev/4.x) and 'examine-test-results' (support/3.x).
        # $1 must always participate in the match, otherwise the check name would contain 'undefined'.
        artifact: /^(?:examine-)?test-results(.*)$/
        name: 'Publish Tests$1'           # e.g. 'Publish Tests-net8.0' or 'Publish Tests'
        path: '*.trx'                     # Path to test results (inside artifact .zip)
        reporter: dotnet-trx              # Format of test results
        fail-on-empty: false              # Don't fail when the triggering build failed before producing results
